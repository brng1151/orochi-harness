# Add PTC mode and Cordis tools to the base spawn/workflow stack, exercising
# all four boundaries in one ACP snapshot.
- id: agent-default-model
  name: '@orochi-network/oh-agent-default-model'
  config:
    provider: orochi-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: !!js 'process.env.OH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@orochi-network/oh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@orochi-network/oh-tools'
  config:
    mode: both

- id: system-prompt
  name: '@orochi-network/oh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@orochi-network/oh-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@orochi-network/oh-tool-cordis/host'
    - id: tool-cordis
      name: '@orochi-network/oh-tool-cordis'
