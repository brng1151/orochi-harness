# Keyless replay counterpart of agent-instructions.cordis.yml: apply the
# scenario values and model swap to the ACP profile.
- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: agent-default-model
  name: '@orochi-network/oh-agent-default-model'
  config:
    provider: orochi-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@orochi-network/oh-agent-instructions'
  config:
    maxBytes: 65536
    ohHome: !!js process.cwd() + '/.oh'
    projectRootMarkers:
      - .oh-project

- id: system-prompt
  name: '@orochi-network/oh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: workspace-context-compaction
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/workspace-context-compaction.ts'
