# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@orochi-network/oh-terminal'

- id: sandbox-policy
  name: '@orochi-network/oh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@orochi-network/oh-subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@orochi-network/oh-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@orochi-network/oh-agent-default-model'
  config:
    provider: orochi-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@orochi-network/oh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@orochi-network/oh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@orochi-network/oh-tool-jobs'
  disabled: true

- id: goal
  name: '@orochi-network/oh-goal'
  disabled: true

- id: goal-round-driver
  name: '@orochi-network/oh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@orochi-network/oh-command-goal'
  disabled: true

- id: tool-goal
  name: '@orochi-network/oh-tool-goal'
  disabled: true

- id: skill
  name: '@orochi-network/oh-skill'
  disabled: true

- id: skill-filesystem
  name: '@orochi-network/oh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@orochi-network/oh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@orochi-network/oh-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@orochi-network/oh-tool-pwsh-persistent'
