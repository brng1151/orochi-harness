# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: plugin-package-inventory-orochi
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- id: sandbox
  name: '@orochi-network/oh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: orochi-messages
            name: Orochi Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: workspace-dependencies
      name: '@orochi-network/oh-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + "/runtime-source"
        root: !!js process.cwd() + "/runtime-installed"

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
