# Replay the authored model turns through the shipped OS sandbox.
- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: plugin-package-inventory-orochi
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
