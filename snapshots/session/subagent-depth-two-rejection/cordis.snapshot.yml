# Keyless counterpart to depth-two.cordis.yml: apply the depth patch and replace
# the live adapter with per-session replay.
- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: sandbox
  name: '@orochi-network/oh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- id: tool-subagent
  name: '@orochi-network/oh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 2
# Select the recorded flash model for this composition.
- id: agent-default-model
  name: '@orochi-network/oh-agent-default-model'
  config:
    provider: orochi-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@orochi-network/oh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@orochi-network/oh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
