# With 1,800 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 6,582 to 5,582, between the history and its condensed replacement.

- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@orochi-network/oh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-flash
                contextWindow: 8382
                defaultMaxTokens: 1000
