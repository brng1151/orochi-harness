# Keyless replay for the `ralph` composition. The shared replay patch in
# `text-turn/cordis.snapshot.yml` applies only to the `default` composition, so
# a sibling composition restates those swaps and adds its own rows.
- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: plugin-package-inventory-orochi
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- id: sandbox
  name: '@orochi-network/oh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@orochi-network/oh-llm-replay'
      config:
        providers:
          - id: orochi-official
            name: Orochi
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: orochi-messages
            name: Orochi Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: tool-ralph
  disabled: false
