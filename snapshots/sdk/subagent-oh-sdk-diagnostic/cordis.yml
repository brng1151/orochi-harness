# TypeScript SDK snapshot patch for foreground and background OH SDK failures.

- id: skill-filesystem
  name: '@orochi-network/oh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: !!js "process.env.OH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- insert:
    - id: subagent-oh-sdk-diagnostic
      name: '@orochi-network/oh-subagent-oh-sdk'
      config:
        providerName: oh-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.OH_TEST_CHILD_PATCH
        ohHome: !!js ohHomePath('children/foreground')
        provider: mock
        model: mock-echo
        env:
          OH_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-oh-sdk-diagnostic
      name: '@orochi-network/oh-tool-subagent'
      config:
        provider: oh-sdk-diagnostic
        toolName: subagent_oh_sdk
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: subagent-oh-sdk-diagnostic-background
      name: '@orochi-network/oh-subagent-oh-sdk'
      config:
        providerName: oh-sdk-diagnostic-background
        profile: sdk
        patches:
          - !!js process.env.OH_TEST_CHILD_PATCH
        ohHome: !!js ohHomePath('children/background')
        provider: mock
        model: mock-echo
        env:
          OH_TEST_CHILD_FAILURE: '1'
          FAKE_INIT_GO: .oh-sdk-background-release
    - id: tool-subagent-oh-sdk-diagnostic-background
      name: '@orochi-network/oh-tool-subagent'
      config:
        provider: oh-sdk-diagnostic-background
        toolName: subagent_oh_sdk_background
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: release-oh-sdk-background-on-job-output
      name: '../../../apps/cli/tests/profiles/sdk/fixtures/subagent-oh-sdk-release-on-job-output.ts'
