# TypeScript SDK snapshot-record patch over `oh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@orochi-network/oh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: !!js "process.env.OH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@orochi-network/oh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: snapshot-message-feedback
      name: '@orochi-network/oh-message-feedback'
      disabled: !!js "process.env.OH_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.OH_SNAPSHOT_FEEDBACK !== '1'"
