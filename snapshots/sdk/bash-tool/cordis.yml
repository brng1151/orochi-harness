# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@orochi-network/oh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: !!js "process.env.OH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@orochi-network/oh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
