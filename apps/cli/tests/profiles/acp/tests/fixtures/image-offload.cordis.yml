# Keyless assembled-request snapshot for native Orochi image offload. The
# local provider endpoint is supplied by the snapshot test; the real attachment
# store and ACP bridge carry two uploaded images into one model request.
- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  config:
    apiKeyEnv: OH_SNAPSHOT_API_KEY
    baseURL: !!js process.env.OH_SNAPSHOT_BASE_URL
    thinking: disabled
    maxRequestFilesBytes: 92
    imageOffloadByteQuantum: 1
    models:
      - id: deepseek-v4-flash-vision-exp
        contextWindow: 32768
        maxTokens: 1024
        inputModalities: [text, image]

- id: acp
  name: '@orochi-network/oh-acp'
  config:
    provider: orochi-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js process.env.OH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@orochi-network/oh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@orochi-network/oh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Keep answers brief and factual.

- id: attachment-local
  name: '@orochi-network/oh-attachment-local'
