# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-orochi
  config:
    baseURL: !!js process.env.OH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    streamIdleTimeoutMs: 150

- id: agent-loop
  config:
    agents:
      - id: main
        provider: orochi-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
