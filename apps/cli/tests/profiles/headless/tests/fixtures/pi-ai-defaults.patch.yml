# pi-ai route and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-orochi
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      deepseek:
        apiKeyEnv: OROCHI_API_KEY
        baseURL: !!js process.env.OH_SNAPSHOT_BASE_URL
        reasoning: low
        modelOverrides:
          deepseek-v4-flash:
            maxTokens: 1024
        streamIdleTimeoutMs: 1000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
