# Missing-credential patch over the shipped headless profile. The replacement
# adapter registers the production route but cannot reach its endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-orochi
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: orochi-official
        model: xiaomi/mimo-v2.6-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-orochi-keyless
      name: '@orochi-network/oh-llm-orochi-api-key'
      config:
        baseURL: 'http://127.0.0.1:9'
