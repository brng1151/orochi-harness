# The automation-only ACP application over oh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@orochi-network/oh-acp-app'

    - id: acp
      name: '@orochi-network/oh-acp'
      inject: [acpAppStartup]
      config:
        provider: orochi-official
        model: xiaomi/mimo-v2.6-flash

- id: hmr
  disabled: true
