# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over oh-base: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.

- insert:
    - id: sdk-app-startup
      name: '@orochi-network/oh-sdk-app'
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@orochi-network/oh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: orochi-llm-api-extensions
      name: '@orochi-network/oh-orochi-llm-api-extensions'

    - id: plugin-package-inventory-orochi
      name: '@orochi-network/oh-plugin-package-inventory-orochi'

    - id: llm-orochi
      name: '@orochi-network/oh-llm-orochi-api-key'
      config:
        apiKeyEnv: OROCHI_API_KEY
        defaultContextWindow: !!js Number(process.env.OH_CONTEXT_WINDOW ?? 1000000)
        streamIdleTimeoutMs: 172800000

    - id: sandbox
      name: '@orochi-network/oh-sandbox-local'

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: session-projection
      name: '@orochi-network/oh-session-projection'

    - id: sandbox-policy
      name: '@orochi-network/oh-sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    - id: subprocess
      name: '@orochi-network/oh-subprocess-local'

    - id: pty
      name: '@orochi-network/oh-terminal'

    - id: terminal-bash
      name: '@orochi-network/oh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@orochi-network/oh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # Keep the minimal agent kernel explicit: unlike oh-base, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@orochi-network/cordis-plugin-timer'

    - id: llm
      name: '@orochi-network/oh-llm'

    - id: session
      name: '@orochi-network/oh-session'

    - id: session-title
      name: '@orochi-network/oh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@orochi-network/oh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.OH_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@orochi-network/oh-tools'

    - id: mcp-resources
      name: '@orochi-network/oh-mcp-resources'

    - id: agent
      name: '@orochi-network/oh-agent'

    - id: llm-retry
      name: '@orochi-network/oh-llm-retry'

    - id: jobs
      name: '@orochi-network/oh-jobs-local'

    - id: invariants
      name: '@orochi-network/oh-invariants'

    - id: session-invariant
      name: '@orochi-network/oh-session/invariant'

    - id: agent-invariant
      name: '@orochi-network/oh-agent/invariant'

    - id: scope-invariant
      name: '@orochi-network/oh-scope/invariant'

    - id: agent-loop-invariant
      name: '@orochi-network/oh-agent-loop/invariant'

    - id: agent-loop
      name: '@orochi-network/oh-agent-loop'
      config:
        agents: []

    - id: persistent-bash
      name: '@orochi-network/oh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@orochi-network/oh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: sessions
      name: '@orochi-network/oh-session-persistence-jsonl'
      config:
        root: !!js ohHomePath('sessions')
        compression: none
