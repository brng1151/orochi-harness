# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-orochi
  name: '@orochi-network/oh-llm-orochi-api-key'
  disabled: true

- id: system-prompt
  name: '@orochi-network/oh-system-prompt'
  config:
    personaPrefix: 'Echo where you run.'

- id: agent-instructions
  name: '@orochi-network/oh-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@orochi-network/oh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@orochi-network/oh-session-persistence-jsonl'
  config:
    root: !!js ohHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'
