[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "orochi-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled oh CLI runtime for the Orochi Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Orochi" }]

[project.urls]
Homepage = "https://github.com/orochi-network/orochi-harness"
Documentation = "https://github.com/orochi-network/orochi-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/orochi-network/orochi-harness/issues"
Source = "https://github.com/orochi-network/orochi-harness"

[project.scripts]
oh = "orochi_harness_runtime:main"

# Include the injected oh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/orochi_harness_runtime/runtime/orochi-harness-sdk-runtime-*",
  "src/orochi_harness_runtime/runtime/orochi-harness-sdk-runtime-*/**",
  "src/orochi_harness_runtime/runtime/linux-*/**",
  "src/orochi_harness_runtime/runtime/macos-*/**",
  "src/orochi_harness_runtime/runtime/win-*/**",
]
exclude = ["src/orochi_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/orochi_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
